<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="lv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="lv-accent-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="lv-accent-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="lv-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#4f46e5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base container: Squircle with precision border -->
  <rect width="40" height="40" rx="10" fill="url(#lv-bg)" />
  <rect x="0.75" y="0.75" width="38.5" height="38.5" rx="9.25" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" />

  <!-- Left/Lower Link & Vault Loop -->
  <path d="M14.5 13C11.5 16 11.5 21 14.5 24L16.5 26C17.7 27.2 19.6 27.2 20.8 26C22 24.8 22 22.9 20.8 21.7L18.8 19.7" 
        stroke="url(#lv-accent-1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right/Upper Link & Vault Loop -->
  <path d="M25.5 27C28.5 24 28.5 19 25.5 16L23.5 14C22.3 12.8 20.4 12.8 19.2 14C18 15.2 18 17.1 19.2 18.3L21.2 20.3" 
        stroke="url(#lv-accent-2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Security Vault Node -->
  <circle cx="20" cy="20" r="2.2" fill="#ffffff" filter="url(#lv-glow)" />
</svg>
