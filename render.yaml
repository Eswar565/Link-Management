databases:
  - name: link-management-db
    databaseName: link_management
    user: link_management
    plan: free

services:
  - type: web
    name: link-management-app
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn app:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: link-management-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FLASK_ENV
        value: production
